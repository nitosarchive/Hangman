<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <script defer src="script.js"></script>
    <title>Hangman</title>
  </head>
  <body>
    <div class="intro-container">
      <h1>Welcome <br>To <br>Hangman</h1>
      <label for="game-start">Tap to play</label>
      <button id="game-start">Start game</button>
    </div>
  
    <div class="game-container hidden">
        <span id="score">0</span>
      <div id="letter-box" class="letter-container"></div>
      <div class="lives">
      </div>
      <button id="restart">Restart</button>
    </div>
    <div class="hidden game-over-container">
      <span>You lost</span>
      <button id="reset">Try again</button>
    </div>
  </body>
</html>
