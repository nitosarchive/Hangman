<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <script defer src="script.js"></script>
    <title>Hangman</title>
  </head>
  <body>
    <div class="intro-container">
      <button id="game-start">Start game</button>
    </div>
    <span id="score"></span>
    <div class="game-container">
      <div id="letter-box" class="letter-container"></div>
      <div class="lives">
        
      </div>
      <button id="restart">Restart</button>
    </div>
    <div class="hidden game-over-container">
      <span>You lost</span>
      <button id="reset">Try again</button>
    </div>
  </body>
</html>
